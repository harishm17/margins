name: CI

# Once per change: a branch is checked through its pull request, and main again after a merge (Railway deploys
# only after main's checks pass). A push to every branch as well ran each pull request twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request stops the run for the older one. Main's runs are never cut short: a cancelled
# run on main makes Railway skip that deploy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every run step under bash with pipefail: without `shell:`, GitHub runs `bash -e`, where a failing command piped into
# another (npm test | tee) does not fail the step.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Postgres with pgvector: the *.db.test.ts files run against the migrated database and skip without one, so the
    # test step below fails if any test skipped.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: margins
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d margins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://dev:devpass@localhost:5432/margins
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx prisma migrate deploy
      - name: Tests, with none skipped (the database tests skip when the database is missing)
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
          grep -q '^ℹ skipped 0$' "$RUNNER_TEMP/test.log" || { echo "some tests were skipped"; exit 1; }
      - name: Tutoring eval parity (the real tutor logic against the committed fixture)
        run: npx tsx --test src/lib/tutor/eval-parity.test.ts src/lib/ask/eval-parity.test.ts src/lib/voice/eval-parity.test.ts
      - run: npm run build

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    # Postgres with pgvector: the tests that touch the database build a throwaway one from the Prisma migrations
    # (tests/conftest.py), including the check that every SQL statement matches the migrated schema. Without it
    # they skip.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: margins
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d margins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://dev:devpass@localhost:5432/margins
      TEST_DB_ADMIN_URL: postgresql://dev:devpass@localhost:5432/postgres
      ANTHROPIC_API_KEY: test-key
      # No default for ENVIRONMENT: the suites say they run as development (the evals import the settings too).
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock
      - run: uv sync --locked --python 3.14
      - run: uv run python -m compileall -q app
      - name: Migrations only add, and the AI service names the newest one
        run: python3 ../scripts/check_migrations.py
      - run: uv run pytest -q
      - name: Eval tests (retrieval, generation and tutoring; the tutoring ones replay the parity fixture)
        run: uv run pytest ../evals -q

  e2e:
    # Playwright against the real stack: Postgres with pgvector, the AI service on the mock LLM (no
    # API calls) and the production build of the web app. scripts/e2e-stack.sh starts both services.
    # Split across three runners, each with its own stack and database (global-setup seeds each one). Setup takes
    # about 4 minutes of each job. The limit stays at 40: a timed-out run on main makes Railway skip the deploy, and a
    # slow runner once cut a 25-minute limit short.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: margins
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d margins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://dev:devpass@localhost:5432/margins
      NEXTAUTH_SECRET: ci-secret-ci-secret-ci-secret-32chars
      NEXTAUTH_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/models
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock
      - name: Cache the embedding model, the tokenizer and the browser
        uses: actions/cache@v4
        with:
          path: |
            .cache/models
            .cache/tiktoken
            ~/.cache/ms-playwright
          key: e2e-assets-${{ hashFiles('frontend/package-lock.json', 'ai-service/uv.lock') }}
      - name: Install the web app and migrate the database
        working-directory: frontend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
      - name: Install the AI service, then fetch the embedding model and the tokenizer once
        working-directory: ai-service
        run: |
          uv sync --locked --python 3.14
          uv run python -c "from fastembed import TextEmbedding; TextEmbedding(model_name='BAAI/bge-small-en-v1.5', cache_dir='$EMBEDDING_CACHE_DIR')"
          uv run python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Build the web app
        working-directory: frontend
        run: npm run build
      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start the AI service and the web app
        run: scripts/e2e-stack.sh start
      - name: Playwright
        working-directory: frontend
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Upload the Playwright report and the service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
            .e2e/*.log
          retention-days: 7
          if-no-files-found: ignore

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t margins-frontend frontend
      - name: Image runs as a non-root user and serves the sign-in page
        run: |
          test "$(docker run --rm --entrypoint id margins-frontend -u)" != "0"
          # Railway's pre-deploy command runs `prisma migrate deploy` in this image.
          docker run --rm --network none --entrypoint prisma margins-frontend --version
          docker run -d --name web -p 3000:3000 \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/db -e ENVIRONMENT=development \
            -e NEXTAUTH_SECRET=ci-secret -e NEXTAUTH_URL=http://127.0.0.1:3000 \
            margins-frontend
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/login && exit 0
            sleep 1
          done
          docker logs web
          exit 1
      - name: Image refuses to start on a public URL without Google sign-in, or with the test sign-in on
        run: |
          refuses() {
            if out="$(timeout 60 docker run --rm \
                -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/db -e ENVIRONMENT=production -e AI_INTERNAL_TOKEN=ci-token \
                -e NEXTAUTH_SECRET=ci-secret \
                -e NEXTAUTH_URL=https://studymargins.com "$@" margins-frontend 2>&1)"; then
              echo "started, but should have refused: $*"; echo "$out"; exit 1
            fi
            grep -q "Refusing to start" <<<"$out" || { echo "no refusal message: $*"; echo "$out"; exit 1; }
          }
          refuses
          refuses -e GOOGLE_OAUTH_CLIENT_ID=your-google-client-id -e GOOGLE_OAUTH_CLIENT_SECRET=your-google-client-secret
          refuses -e GOOGLE_OAUTH_CLIENT_ID=1-ci.apps.googleusercontent.com -e GOOGLE_OAUTH_CLIENT_SECRET=ci-not-a-real-google-secret \
            -e ENABLE_TEST_LOGIN=true

  ai-service-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t margins-ai ai-service
      - name: Image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id margins-ai -u)"
          echo "uid=$uid"
          test "$uid" != "0"
      - name: Embedding model and tokenizer load offline as the app user
        run: |
          docker run --rm --network none --entrypoint python margins-ai -c \
            "import os; from fastembed import TextEmbedding; m = TextEmbedding(model_name='BAAI/bge-small-en-v1.5', cache_dir=os.environ['EMBEDDING_CACHE_DIR']); print(len(next(iter(m.embed(['hello'])))))"
          docker run --rm --network none --entrypoint python margins-ai -c \
            "import tiktoken; print(len(tiktoken.get_encoding('cl100k_base').encode('hello world')))"
      - name: catdoc is available for legacy .doc uploads
        run: docker run --rm --network none --entrypoint catdoc margins-ai -V
      - name: Uploads are read by the limited child process as the image's user
        run: |
          docker run --rm --network none -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/db -e ANTHROPIC_API_KEY=test-key -e ENVIRONMENT=development \
            --entrypoint python margins-ai -c "
          import asyncio, docx
          from app.services.document_processor.sandbox import parse_document
          d = docx.Document(); d.add_paragraph('Hash tables map keys to buckets.'); d.save('/tmp/t.docx')
          r = asyncio.run(parse_document('/tmp/t.docx', 't.docx', markdown=True))
          assert 'Hash tables' in r.text, r
          print('child parse ok', r.page_count)
          "
      - name: Image starts; /health stays unready without its database
        run: |
          docker run -d --name ai -p 8000:8000 \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/db -e ANTHROPIC_API_KEY=test-key -e ENVIRONMENT=development \
            margins-ai
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/; then
              code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)"
              echo "/health: $code"
              test "$code" = "503" && exit 0
              docker logs ai
              exit 1
            fi
            sleep 1
          done
          docker logs ai
          exit 1

  backup-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck backup/backup.sh
      - run: docker build -t margins-backup backup
      - name: pg_dump matches production's Postgres 18, rclone is there, the job runs as a non-root user
        run: |
          docker run --rm --entrypoint sh margins-backup -c \
            'pg_dump --version | grep -q "PostgreSQL) 18\." && rclone version >/dev/null && test "$(id -u)" != 0'
      - name: The job refuses to start without its settings
        run: |
          if docker run --rm margins-backup; then exit 1; fi
