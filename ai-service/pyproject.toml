[project]
name = "margins-ai-service"
version = "0.1.0"
description = "AI service for Margins"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.150.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    # Database
    "asyncpg>=0.32.0",
    "pgvector>=0.5.1",
    # LLM providers
    "openai>=3.35.1",
    "anthropic>=1.15.0",
    # Document processing
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "tiktoken>=0.14.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    # Utilities (httpx is called directly: voice tokens, self-calls; boto3 reads the S3 bucket)
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
    "fastembed>=0.9.0",
    "boto3>=1.43.116",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]
asyncio_mode = "auto"
